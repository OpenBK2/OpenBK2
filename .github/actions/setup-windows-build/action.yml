name: Setup Windows build environment
description: >
  MSVC, Ninja, the DirectX SDK and ccache, which every Windows job here needs and
  which are easy to get subtly wrong. Kept in one place so the build and test
  workflows cannot drift apart: they did once, and the tests failed because they were
  missing the SDK and were on a different compiler.

inputs:
  arch:
    description: x64 or x86
    required: true
  ccache-key:
    description: >
      Name of this job's compiler cache. Each job that builds something different
      needs its own, since a job saves only what it used (see evict-old-files).
    required: true
  ccache-max-size:
    description: Upper bound on the compiler cache this job saves
    required: false
    default: 1500M

runs:
  using: composite
  steps:
    - name: Setup MSVC dev command prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ inputs.arch }}

    - name: Install Ninja
      uses: seanmiddleditch/gha-setup-ninja@v6

    - name: Set DXSDK env
      shell: bash
      run: |
        DXSDK_ROOT_WIN=$(cygpath -w $HOME/cache)
        echo "DXSDK_ROOT=$DXSDK_ROOT_WIN" >> $GITHUB_ENV

    # ~ rather than $HOME: actions/cache expands a leading ~ but not environment
    # variables, so the old "$HOME/cache" named a directory that never exists and
    # this cache was never saved. The SDK was downloaded on every run.
    - name: Cache DXSDK
      id: dxsdk-cache
      uses: actions/cache@v5
      with:
        path: ~/cache
        key: DXSDK-Jun2010

    - name: Install 7z
      if: steps.dxsdk-cache.outputs.cache-hit != 'true'
      uses: milliewalky/setup-7-zip@v2

    - name: Install DirectX SDK (June 2010)
      if: steps.dxsdk-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl -L "https://download.microsoft.com/download/a/e/7/ae743f1f-632b-4809-87a9-aa1bb3458e31/DXSDK_Jun10.exe" -o DXSDK_Jun10.exe
        7z x DXSDK_Jun10.exe DXSDK/Include -o_DX2010_
        7z x DXSDK_Jun10.exe DXSDK/Lib -o_DX2010_
        mv _DX2010_/DXSDK $HOME/cache

    # Installs ccache and puts it on PATH, where cmake/ccache.cmake finds it at
    # configure time, then restores this job's cache and saves it again when the
    # job ends. The build is already set up for it: /Z7 rather than /Zi, and the
    # sloppiness settings that let precompiled-header compiles be cached, both
    # explained in cmake/ccache.cmake.
    #
    # The repository gets 10 GB of cache in total, shared by every job, so each
    # one is capped, and evict-old-files drops whatever this job did not use
    # before saving, so a cache holds one build's worth of objects rather than
    # accumulating every revision's.
    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ inputs.ccache-key }}
        max-size: ${{ inputs.ccache-max-size }}
        evict-old-files: job
