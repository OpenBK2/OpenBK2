name: Build (Windows)

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025-vs2026
    strategy:
      matrix:
        preset: [Windows-x64-Release, Windows-x86-Release]

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # Same steps as before, moved to a composite action so the test workflow uses
      # exactly this environment rather than its own approximation of it.
      - name: Setup build environment
        uses: ./.github/actions/setup-windows-build
        with:
          arch: ${{ contains(matrix.preset, 'x64') && 'x64' || 'x86' }}

      - name: Configure with preset
        run: cmake --preset ${{ matrix.preset }}

      - name: Build with preset
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Install
        run: cmake --install out/build/${{ matrix.preset }} --prefix install/${{ matrix.preset }}

      - name: Compress artifact
        run: |
          7z a ${{ matrix.preset }}.zip ./install/${{ matrix.preset }}

      - name: Upload artifact to workflow (optional)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.preset }}-install
          path: ${{ matrix.preset }}.zip

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
