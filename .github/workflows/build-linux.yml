name: Build (Linux)

# A gate, not a release job. It proves the tree still builds off Windows and that
# the unit tests pass there, and it publishes nothing: there is no Linux release
# to cut, and the install rules still expect game data that is not checked out
# here.
#
# Two jobs, split by compiler rather than by configuration:
#
#   build         GCC, BUILD_EDITOR=ON. The whole tree and all 55 tests.
#   build-clang   clang, BUILD_EDITOR=OFF. The engine, Game and 46 tests.
#
# The GCC job is the complete one. The editor configuration is a superset of the
# game one -- the engine libraries and Game are built either way -- and the
# editor is what the Linux port is for, so building it without the editor would
# leave the part most likely to regress unwatched. The cost is wxWidgets, which
# is built from source and dominates the job until its cache is warm.
#
# clang is a second opinion, not a second platform, and it has earned its place:
# it rejects constructs GCC accepts (a member template body is checked where it
# is written, not where it is instantiated) and it optimises on undefined
# behaviour GCC leaves alone, which is how a strict aliasing violation that
# decoded every DXT block to near-black was found. No warning on either compiler
# reports that one at any level, so only building it catches it. It therefore
# runs the tests too, which is where that defect actually showed up.
#
# It does not build the editor, which is what keeps it cheap: wxWidgets is built
# from source per compiler, so BUILD_EDITOR=ON here would mean a second wx cache
# and a second cold wx build. The nine tests that only exist with the editor
# (GrannyGltf, SkeletonExporter, VisObjBuilder, LuaKeywords and the rest) stay
# GCC-only.

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      # Both outside out/build, so the cache steps can restore and save them
      # without reaching into the build tree.
      DXVK_ROOT: ${{ github.workspace }}/.dxvk
      WX_ROOT: ${{ github.workspace }}/.wx/Linux-x64-Release

    steps:
      # Only what the build reads. The full tree is 11 GB and 238k files, almost
      # all of it game data; see build-windows.yml for the reasoning. Note that of
      # Versions/Current only the font/text fixtures are checked out, so the four
      # DDS tests that read the shipped textures skip themselves rather than fail.
      # Fonts supplies the font files/textures for the tests and obk2_fonts.pak
      # (3 MB). bin/fonts supplies the baked glyph metrics TextVerticalAlignment
      # reads by resource UUID; the textures alone are not enough (308 KB).
      # Tags and Citations supply the heading styles and advice text used by
      # TextVerticalAlignment's clipping regression tests.
      # GLB_format_usage is the example glTF units GltfBounds_test loads (4 MB).
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive
          filter: blob:none
          sparse-checkout: |
            .github
            cmake
            third_party
            Versions/Temporary/Engine/Sources
            Versions/Current/Data/Fonts
            Versions/Current/Data/bin/fonts
            Versions/Current/Data/Consts/Game/Tags
            Versions/Current/Data/Citations
            OBK2_Examples/GLB_format_usage

      - name: Setup build environment
        uses: ./.github/actions/setup-linux-build
        with:
          dxvk-root: ${{ env.DXVK_ROOT }}
          ccache-key: linux-editor
          ccache-max-size: 2G

      # cmake/wxwidgets.cmake decides whether an install can be reused by
      # comparing the build id recorded inside it against what this revision
      # would build, so the lookup is by prefix and a stale install is harmless.
      - name: Restore wxWidgets
        id: wx-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.WX_ROOT }}
          key: wx-Linux-x64-Release
          restore-keys: wx-Linux-x64-Release-

      # OBK2_WERROR is off by default and on here: the rule set in
      # cmake/warnings.cmake is measured at zero sites on this tree, so the
      # only thing it can fail on is a regression. It stays an option rather
      # than a default because a packager or a developer on a newer compiler
      # should not get a hard failure out of a diagnostic that did not exist
      # when this was written. See docs/DiagnosticsRuleSet.md.
      - name: Configure with preset
        run: >
          cmake --preset Linux-x64-Release
          -DBUILD_EDITOR=ON
          -DOBK2_WERROR=ON
          "-DWX_ROOT=${{ env.WX_ROOT }}"

      - name: Build with preset
        run: cmake --build --preset Linux-x64-Release --parallel

      # Saved under the build id, and only when that differs from what was
      # restored, which is exactly when this job built wx. The id file is written
      # last, so its presence also means the install finished.
      - name: Name the wxWidgets install
        id: wx-id
        run: |
          id_file="$WX_ROOT/wx-build-id.txt"
          if [ -f "$id_file" ]; then
            echo "key=wx-Linux-x64-Release-$(cat "$id_file")" >> "$GITHUB_OUTPUT"
          fi

      - name: Save wxWidgets
        if: steps.wx-id.outputs.key != '' && steps.wx-id.outputs.key != steps.wx-restore.outputs.cache-matched-key
        uses: actions/cache/save@v5
        with:
          path: ${{ env.WX_ROOT }}
          key: ${{ steps.wx-id.outputs.key }}

      # The tests are EXCLUDE_FROM_ALL, so the build above does not touch them.
      # add_unit_test puts each one into this aggregate target, which means a new
      # test needs no change here. -k 0 goes after --, since it is Ninja's
      # keep-going flag and not a cmake --build option.
      - name: Build tests
        run: cmake --build out/build/Linux-x64-Release --parallel --target unittests -- -k 0

      - name: Run tests
        run: >
          ctest --test-dir out/build/Linux-x64-Release
          -L obk2-test --output-on-failure
          --output-junit ${{ github.workspace }}/tests-linux.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-linux
          path: tests-linux.xml

  build-clang:
    runs-on: ubuntu-24.04

    env:
      # No WX_ROOT: this job does not build the editor, so wxWidgets never
      # enters the configuration. The DXVK cache is shared with the job above,
      # because setup-linux-build keys it on the DXVK commit and DXVK is built
      # by meson with its own compiler choice, not by this tree's.
      DXVK_ROOT: ${{ github.workspace }}/.dxvk

    steps:
      # Same paths as the GCC job. The fixtures are what the tests read, and the
      # tests are the point of this job, so trimming the list here would only
      # make them skip themselves.
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive
          filter: blob:none
          sparse-checkout: |
            .github
            cmake
            third_party
            Versions/Temporary/Engine/Sources
            Versions/Current/Data/Fonts
            Versions/Current/Data/bin/fonts
            Versions/Current/Data/Consts/Game/Tags
            Versions/Current/Data/Citations
            OBK2_Examples/GLB_format_usage

      # Its own ccache, since a job saves only what it used and these two share
      # no objects at all.
      - name: Setup build environment
        uses: ./.github/actions/setup-linux-build
        with:
          dxvk-root: ${{ env.DXVK_ROOT }}
          ccache-key: linux-clang
          ccache-max-size: 2G

      # From Ubuntu's own repositories, not apt.llvm.org: the diagnostics that
      # matter here are not new. clang 19 rejects the same constructs and
      # miscompiles the same aliasing violation as clang 22 does, so a current
      # release buys nothing a packaged one does not already give, and costs a
      # third-party apt source on every run.
      #
      # Pinned to a version rather than installing bare "clang", so that a
      # refresh of the runner image cannot quietly change which compiler is
      # gating the tree. apt-get update already ran in the step above, so this
      # needs only the install.
      #
      # 19 is a floor, not a preference, and going below it does not work.
      # P0522, the C++17 rule that lets std::basic_string bind to a
      # template <typename> class parameter, is on by default in clang from 19
      # and off before it, while GCC and MSVC have both implemented it for
      # years. libdb/ObjMan.h relies on it: the specialisations of SetValue and
      # GetValue for <std::basic_string, char> are the ones that stop a
      # std::string being serialised as a container of chars, and clang 18
      # rejects all four as matching no template. The construct is valid C++17,
      # so the floor belongs here rather than in the header.
      #
      # The version goes to the log because a build log that does not say what
      # built it cannot be compared against a later one.
      - name: Install clang
        run: |
          sudo apt-get install -y --no-install-recommends clang-19
          clang++-19 --version

      # The preset names plain clang/clang++, which is right on a developer's
      # machine and wrong here, where the point is the pin above. Cache
      # variables from a preset are overridable on the command line, so this
      # keeps one definition of everything else in CMakePresets.json.
      #
      # base-linux-clang stays on libstdc++ deliberately -- libc++ would change
      # unordered container iteration order, which is an ASYNC risk in
      # simulation code -- so this is a second front end over the same standard
      # library, and a divergence between the two jobs is a real defect rather
      # than two libraries disagreeing.
      # The clang rule set is its own list, not GCC's: a flag is listed for the
      # compiler it was measured on, and the two disagree enough to matter
      # (-Wextra-semi is 0 sites on GCC and 1123 on clang; clang accepts
      # -Wredundant-decls and silently does nothing with it, where GCC finds 31).
      - name: Configure with preset
        run: >
          cmake --preset Linux-x64-Clang-Release
          -DBUILD_EDITOR=OFF
          -DOBK2_WERROR=ON
          -DCMAKE_C_COMPILER=clang-19
          -DCMAKE_CXX_COMPILER=clang++-19

      - name: Build with preset
        run: cmake --build --preset Linux-x64-Clang-Release --parallel

      - name: Build tests
        run: cmake --build out/build/Linux-x64-Clang-Release --parallel --target unittests -- -k 0

      # 46 of the 55, the nine editor-only ones being absent from this
      # configuration rather than skipped.
      - name: Run tests
        run: >
          ctest --test-dir out/build/Linux-x64-Clang-Release
          -L obk2-test --output-on-failure
          --output-junit ${{ github.workspace }}/tests-linux-clang.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-linux-clang
          path: tests-linux-clang.xml
