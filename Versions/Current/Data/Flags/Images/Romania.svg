<?xml version="1.0" encoding="UTF-8"?>
<!--
  Flag of Romania: blue, yellow and red in three equal vertical bands, 2:3.
  The Kingdom's plain flag; the People's Republic from 1948 added its arms,
  which this plain drawing stands for too. Colours are today's values.

  Source: drawn for OpenBK2 from the construction described above.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
	<rect width="300" height="600" fill="#002b7f"/>
	<rect x="300" width="300" height="600" fill="#fcd116"/>
	<rect x="600" width="300" height="600" fill="#ce1126"/>
</svg>
