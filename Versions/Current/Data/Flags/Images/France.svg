<?xml version="1.0" encoding="UTF-8"?>
<!--
  Flag of France: blue, white and red in three equal vertical bands, 2:3.
  Vichy France flew it too. Colours are today's values.

  Source: drawn for OpenBK2 from the construction described above.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
	<rect width="300" height="600" fill="#002654"/>
	<rect x="300" width="300" height="600" fill="#fff"/>
	<rect x="600" width="300" height="600" fill="#ed2939"/>
</svg>
